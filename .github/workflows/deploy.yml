# The site is built and served by Cloudflare (see wrangler.jsonc) at agrimjaimini.com.
# This workflow only keeps agrimjaimini.github.io pointing there: it publishes a tiny
# page that forwards every path to the same path on the custom domain. It runs when
# this file changes (or by hand), not on every push.
name: Redirect GitHub Pages to agrimjaimini.com

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write redirect page
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Agrim Jaimini</title>
            <link rel="canonical" href="https://agrimjaimini.com/">
            <meta http-equiv="refresh" content="0; url=https://agrimjaimini.com/">
            <script>location.replace('https://agrimjaimini.com' + location.pathname + location.search + location.hash)</script>
          </head>
          <body>Moved to <a href="https://agrimjaimini.com/">agrimjaimini.com</a>.</body>
          </html>
          HTML
          # GitHub Pages serves 404.html for every unknown path, so deep links redirect too
          cp site/index.html site/404.html
          touch site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
